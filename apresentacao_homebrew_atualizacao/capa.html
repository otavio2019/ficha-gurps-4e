<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Códice de Campo — Atualização consolidada</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #ffffff; border-top: 8px solid #990000; color: #111111; display: grid; grid-template-columns: 54% 46%; }
    .cover-copy { padding: 76px 54px 52px 76px; display: flex; flex-direction: column; justify-content: space-between; }
    .eyebrow { font: 700 14px/1.2 Arial, sans-serif; color: #990000; letter-spacing: 2px; text-transform: uppercase; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 76px; line-height: .95; font-weight: 900; letter-spacing: -3px; max-width: 570px; }
    .subtitle { border-top: 2px solid #111111; padding-top: 20px; max-width: 510px; font: 400 22px/1.35 Arial, sans-serif; color: #333333; }
    .meta { font: 700 14px/1.4 Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; color: #333333; }
    .cover-art { background: #f4f1ed; border-left: 2px solid #111111; padding: 42px; display: flex; align-items: center; justify-content: center; }
    .image-frame { width: 490px; height: 470px; background: #111111; border: 2px solid #990000; padding: 12px; display: flex; align-items: center; justify-content: center; }
    .image-frame img { width: 462px; height: 442px; object-fit: contain; }
    .caption { margin-top: 16px; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #990000; text-align: center; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="cover-copy">
      <div>
        <p class="eyebrow">Ficha digital GURPS 4e</p>
        <h1>Códice<br>de Campo</h1>
      </div>
      <p class="subtitle">Atualização consolidada: da biblioteca Homebrew à mesa de jogo conectada.</p>
      <p class="meta">Entregas recentes · Agosto de 2026</p>
    </section>
    <section class="cover-art">
      <div>
        <div class="image-frame"><img src="/home/ubuntu/nh-validation/ally-portrait-desktop.png" alt="Prévia da ficha digital Códice de Campo"></div>
        <p class="caption">Uma ficha que acompanha a campanha</p>
      </div>
    </section>
  </div>
</body>
</html>
